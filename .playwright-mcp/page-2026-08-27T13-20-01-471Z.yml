                - heading "前言" [level=2] [ref=f3e96]
                - paragraph [ref=f3e97]:
                  - text: 独角数卡是一种在线发卡平台，它可以帮助用户建立个人网站或在线店铺，通过这个平台可以方便地管理店铺和售卖商品。宝塔是一种开源的网站建站系统，它提供了一个图形化界面来管理Web服务器，如LNMP/LAMP/
                  - link "LNAMP" [ref=f3e99] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=221543466&content_type=Article&match_order=1&q=LNAMP&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODgwMDk2MDAsInEiOiJMTkFNUCIsInpoaWRhX3NvdXJjZSI6ImVudGl0eSIsImNvbnRlbnRfaWQiOjIyMTU0MzQ2NiwiY29udGVudF90eXBlIjoiQXJ0aWNsZSIsIm1hdGNoX29yZGVyIjoxLCJ6ZF90b2tlbiI6bnVsbH0.5kmTJwBFAfw-EB9mLQEBeRdhr3fZwj62LhDmhICeOBA&zhida_source=entity
                  - text: 等。 它包含了很多常用的网站管理功能，如数据库管理、FTP管理、文件管理、网站管理等。 宝塔的目标是让管理Web服务器变得简单易用。独角数卡项目地址：
                  - link "https://github.com/assimon/dujiaoka..." [ref=f3e102] [cursor=pointer]:
