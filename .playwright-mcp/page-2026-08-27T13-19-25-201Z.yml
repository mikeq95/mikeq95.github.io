            - generic [ref=f1e84]:
              - blockquote [ref=f1e85]:
                - text: 随着数字化时代的不断发展，虚拟产品，如
                - link "游戏卡密" [ref=f1e87] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=236114417&content_type=Article&match_order=1&q=%E6%B8%B8%E6%88%8F%E5%8D%A1%E5%AF%86&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODgwMDk1NjMsInEiOiLmuLjmiI_ljaHlr4YiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyMzYxMTQ0MTcsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.xn6EUBDgkVcVpR7HiS--N4II2VX6hqLGicD-LLJxLkw&zhida_source=entity
                - text: 、软件许可、
                - link "会员订阅" [ref=f1e91] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=236114417&content_type=Article&match_order=1&q=%E4%BC%9A%E5%91%98%E8%AE%A2%E9%98%85&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODgwMDk1NjMsInEiOiLkvJrlkZjorqLpmIUiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyMzYxMTQ0MTcsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.63vmKBkR43_YgPjCSk3HY57-BmjFOWu06ajUpI5K6xM&zhida_source=entity
                - text: 等，已经成为了市场上不可或缺的增值服务。在这种环境下，自助售货系统可以商家提供了更高效的销售途径，也为消费者提供了更加方便的消费体验。
              - heading "应用简览" [level=3] [ref=f1e94]
              - paragraph [ref=f1e95]:
                - text: 独角数卡（dujiaoka）是一个开源的
                - link "自动售货系统" [ref=f1e97] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=236114417&content_type=Article&match_order=1&q=%E8%87%AA%E5%8A%A8%E5%94%AE%E8%B4%A7%E7%B3%BB%E7%BB%9F&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODgwMDk1NjMsInEiOiLoh6rliqjllK7otKfns7vnu58iLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyMzYxMTQ0MTcsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.kDUfK9VsGBi82JB0nvjWFJ5kiV5HrOWOTZOjU_t7Vc0&zhida_source=entity
                - text: ，为站长提供了一个自动化的售货解决方案。它旨在提供一个高效、稳定且快速的在线售货平台，适用于各类数字商品的销售。
              - heading "主要功能" [level=3] [ref=f1e100]
              - list [ref=f1e101]:
                - listitem [ref=f1e102]: • 高效自动化：独角数卡通过自动化处理订单，减少人力需求，提高售货效率。
                - listitem [ref=f1e103]:
                  - text: • 数字商品管理：用户可以轻松上传和管理数字商品，如
                  - link "软件许可证" [ref=f1e105] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=236114417&content_type=Article&match_order=1&q=%E8%BD%AF%E4%BB%B6%E8%AE%B8%E5%8F%AF%E8%AF%81&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODgwMDk1NjMsInEiOiLova_ku7borrjlj6_or4EiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyMzYxMTQ0MTcsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.H4gGypWqVe6ympzBMMhSXNSMYaFWSx8JGnmNT5oW3jQ&zhida_source=entity
                  - text: 、游戏时间卡等。
                - listitem [ref=f1e108]: • 订单处理：系统支持即时订单处理，自动发货，提供顾客即时满意的购物体验。
                - listitem [ref=f1e109]: • 支付集成：支持多种支付方式，包括但不限于支付宝、微信支付等，方便国内外顾客支付。
                - listitem [ref=f1e110]:
                  - text: •
                  - link "响应式设计" [ref=f1e113] [cursor=pointer]:
                    - /url: https://zhida.zhihu.com/search?content_id=236114417&content_type=Article&match_order=1&q=%E5%93%8D%E5%BA%94%E5%BC%8F%E8%AE%BE%E8%AE%A1&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODgwMDk1NjMsInEiOiLlk43lupTlvI_orr7orqEiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyMzYxMTQ0MTcsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.hmCYzgU16eu0cAOtONgVATnui8qpqNMQH7v0FNPtHmk&zhida_source=entity
                  - text: ：界面支持适配多种设备，无论顾客使用电脑还是手机均能流畅购物。
                - listitem [ref=f1e116]: • 多语言支持：提供多语言界面，满足不同国家和地区用户的需求。
              - heading "应用特色" [level=3] [ref=f1e117]
              - heading "一、支持销售数据统计" [level=3] [ref=f1e118]
              - paragraph [ref=f1e119]: 独角数卡提供详尽的数据统计功能，能够跟踪和显示总订单数、已完成订单、销售额以及支付方式分布等关键销售指标，能帮助站长更好的了解销售状况。
              - paragraph [ref=f1e120]
              - figure "image-20231109122958486" [ref=f1e121]
              - paragraph [ref=f1e125]
              - heading [level=3] [ref=f1e126]:
                - text: 二、支持
                - link "细粒度" [ref=f1e128] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=236114417&content_type=Article&match_order=1&q=%E7%BB%86%E7%B2%92%E5%BA%A6&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODgwMDk1NjMsInEiOiLnu4bnspLluqYiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyMzYxMTQ0MTcsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.rmsRazwP9fVsvVHaswMz0kcNSZ8o-v3iTAoo9QOQ8nM&zhida_source=entity
                - text: 的权限管理
              - paragraph [ref=f1e131]:
                - text: 通过实施基于角色的访问控制（
                - link "RBAC" [ref=f1e133] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=236114417&content_type=Article&match_order=1&q=RBAC&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODgwMDk1NjMsInEiOiJSQkFDIiwiemhpZGFfc291cmNlIjoiZW50aXR5IiwiY29udGVudF9pZCI6MjM2MTE0NDE3LCJjb250ZW50X3R5cGUiOiJBcnRpY2xlIiwibWF0Y2hfb3JkZXIiOjEsInpkX3Rva2VuIjpudWxsfQ.ApJSRIc8I_jkNjW5uCWpsR2doELLdz9JQuufLVIpQts&zhida_source=entity
                - text: ），独角数卡允许站长为不同的团队成员设定具体权限，确保每个员工只能访问其职责范围内的信息和操作，加强内部管理和数据安全。例如你可以为销售人员、财务人员或运营人员分配对应的权限，从而实现细粒度的权限控制。
              - paragraph [ref=f1e136]
              - figure "image-20231109123015433" [ref=f1e137]
              - paragraph [ref=f1e141]
              - heading "三、支持自动发送订单邮件" [level=3] [ref=f1e142]
              - paragraph [ref=f1e143]: 独角数卡可以配置邮件模板，当顾客成功下单后，系统会自动发送含有产品卡密和详细信息的邮件，可以极大的提高发货效率。
              - paragraph [ref=f1e144]
              - figure "image-20231109123031144" [ref=f1e145]
              - paragraph [ref=f1e149]
              - heading "四、支持多种支付方式" [level=3] [ref=f1e150]
              - paragraph [ref=f1e151]: 独角数卡支持对接多种支付方式、包括微信、支付宝、QQ支付、Paypal等等，无论是国内客户还是国外客户，都可以满足快速支付，扩大了潜在客户群。
              - paragraph [ref=f1e152]
              - figure "image-20231109123049150" [ref=f1e153]
              - paragraph [ref=f1e157]
              - heading "五、支持配置优惠码" [level=3] [ref=f1e158]
              - paragraph [ref=f1e159]:
                - text: 系统支持创建和管理优惠码，这些代码可以针对特定产品设置，并包括使用次数限制，可以更方便的进行
                - link "市场营销" [ref=f1e161] [cursor=pointer]:
                  - /url: https://zhida.zhihu.com/search?content_id=236114417&content_type=Article&match_order=1&q=%E5%B8%82%E5%9C%BA%E8%90%A5%E9%94%80&zd_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6aGlkYV9zZXJ2ZXIiLCJleHAiOjE3ODgwMDk1NjMsInEiOiLluILlnLrokKXplIAiLCJ6aGlkYV9zb3VyY2UiOiJlbnRpdHkiLCJjb250ZW50X2lkIjoyMzYxMTQ0MTcsImNvbnRlbnRfdHlwZSI6IkFydGljbGUiLCJtYXRjaF9vcmRlciI6MSwiemRfdG9rZW4iOm51bGx9.j5fnngiLDP_6nxVOdoLqUc6Mu9D2Fcf4AoOKq6u3VTA&zhida_source=entity
                - text: 。
              - paragraph [ref=f1e164]
              - figure "image-20231109123115453" [ref=f1e165]
              - paragraph [ref=f1e169]
              - heading "安装指南" [level=3] [ref=f1e170]
